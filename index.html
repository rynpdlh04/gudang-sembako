<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gudang Sembako Digital 🌾</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">

        <header
            class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-6 rounded-2xl shadow-md text-center md:text-left md:flex md:justify-between md:items-center">
            <div>
                <h1 class="text-3xl font-black tracking-tight">Gudang Sembako Digital 🌾</h1>
                <p class="text-emerald-100 mt-1">Sistem Manajemen Stok & Inventaris Real-Time</p>
            </div>
            <div class="mt-4 md:mt-0 bg-white/20 px-4 py-2 rounded-xl backdrop-blur-xs">
                <span class="text-sm font-medium">Status Server:</span>
                <span id="server-status"
                    class="ml-1 px-2 py-0.5 bg-emerald-400 text-emerald-950 font-bold text-xs rounded-full uppercase animate-pulse">Checking</span>
            </div>
        </header>

        <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-200 flex items-center space-x-4">
                <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg text-2xl">📦</div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider">Total Jenis Barang</p>
                    <h3 id="stat-total-items" class="text-xl font-bold text-gray-800">0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-200 flex items-center space-x-4">
                <div class="p-3 bg-amber-100 text-amber-600 rounded-lg text-2xl">⚠️</div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider">Stok Menipis (&lt; 10)</p>
                    <h3 id="stat-low-stock" class="text-xl font-bold text-gray-800">0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-200 flex items-center space-x-4">
                <div class="p-3 bg-blue-100 text-blue-600 rounded-lg text-2xl">💰</div>
                <div>
                    <p class="text-xs text-gray-500 font-medium uppercase tracking-wider">Estimasi Nilai Aset</p>
                    <h3 id="stat-total-value" class="text-xl font-bold text-gray-800">Rp 0</h3>
                </div>
            </div>
        </section>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">

            <section class="bg-white p-6 rounded-2xl shadow-xs border border-gray-200 lg:col-span-1">
                <h2 class="text-lg font-bold text-gray-800 border-b pb-3 mb-4 flex items-center gap-2">
                    <span>➕</span> Tambah Barang Baru
                </h2>

                <form id="product-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Barang</label>
                        <input type="text" id="itemName" placeholder="Contoh: Beras Cianjur 5kg" required
                            class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-hidden bg-gray-50/50 transition">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Jumlah Stok</label>
                            <input type="number" id="itemStock" min="1" placeholder="0" required
                                class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-hidden bg-gray-50/50 transition">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Satuan</label>
                            <select id="itemUnit"
                                class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-hidden bg-gray-50/50 transition">
                                <option value="Karung">Karung</option>
                                <option value="Pcs">Pcs</option>
                                <option value="Dus">Dus</option>
                                <option value="Liter">Liter</option>
                                <option value="Kg">Kg</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Harga Satuan (Rp)</label>
                        <input type="number" id="itemPrice" min="0" placeholder="Contoh: 65000" required
                            class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-hidden bg-gray-50/50 transition">
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold shadow-xs hover:shadow-md transition duration-200"
                        onclick="tambahBarang()">
                        Simpan ke Gudang
                    </button>
                </form>
            </section>

            <section class="bg-white rounded-2xl shadow-xs border border-gray-200 lg:col-span-2 overflow-hidden">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <span>📋</span> Daftar Stok Sembako
                    </h2>
                    <span id="item-counter"
                        class="text-xs font-semibold bg-gray-200 text-gray-700 px-2.5 py-1 rounded-full">
                        0 Barang
                    </span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-gray-100/70 border-b border-gray-200 text-gray-600 text-xs uppercase font-semibold tracking-wider">
                                <th class="p-4">Nama Barang</th>
                                <th class="p-4 text-center">Stok</th>
                                <th class="p-4">Harga Satuan</th>
                                <th class="p-4">Total Asset</th>
                                <th class="p-4 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body" class="divide-y divide-gray-100 text-sm">

                            <!-- output akan di generate disini -->

                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
